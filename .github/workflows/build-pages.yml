# コラム・物件・成約実績の manifest や記事を更新して push すると、
# 静的ページ（/columns/ /properties/ /results/）と sitemap.xml を自動で再生成してコミットする。
# tools/souba/ のデータ・テンプレートを更新すると、武蔵小杉マンション相場帳（/souba/）も再生成する。
name: build static pages

on:
  push:
    branches: [main]
    paths:
      - 'columns/manifest.json'
      - 'columns/purchase/*.html'
      - 'columns/sale/*.html'
      - 'properties/manifest.json'
      - 'results/manifest.json'
      - 'area/manifest.json'
      - 'area/images.json'
      - 'index.html'
      - 'tools/build_pages.py'
      - 'tools/pages/**'
      - 'tools/souba/**'
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
  schedule:
    - cron: '23 0 * * 1'   # 毎週月曜 9:23（日本時間）。相場帳の売出中住戸の情報更新日を新しくし、掲載終了を記録する
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow jinja2
      - name: 画像をWebP化（新しい画像だけ）
        run: python3 tools/make_webp.py
      - name: コラムのOGP画像（新規・タイトル変更のコラムだけ）
        run: |
          if [ -n "$(python3 tools/make_col_ogp.py --pending)" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra >/dev/null
            python3 tools/make_col_ogp.py
          fi
      - run: python3 tools/build_pages.py
      - name: 相場帳：販売物件の控えと掲載終了の記録
        run: python3 tools/souba/scripts/sync_listings.py
      - name: 武蔵小杉マンション相場帳（/souba/）
        run: python3 tools/souba/build.py --out souba --origin https://speard.jp --base /souba/
      - name: commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "speard-bot"
            git config user.email "info@speard.jp"
            git add -A
            git commit -m "静的ページを自動再生成"
            git push
          fi
